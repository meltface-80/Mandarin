name: Tailscale engine

# The built-in Tailscale engine (android/musicdnet) for Mandarin's installs, on
# every push to main (item 394: what was docker-publish.yml's engine job, the
# container image gone). Never a tag or a release: those are cut by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tailscale-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI on this commit, passed: every test (v0.8.31). The engine below waits
  # for it, so none is published from a commit whose tests fail
  # (.github/wait-for-ci.sh).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

  # Tailscale built into the server: the engine for each platform, attached to
  # the rolling "engine" pre-release, which the server downloads by itself
  # (server/Mandarin.Server/Admin/Tailscale.cs; the Linux installer's and
  # Mandarin OS's installs carry none). A pre-release, and never "latest", so the server's
  # own updater (releases/latest) never mistakes it for a MusicD release.
  engine:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: android/musicdnet/go.mod
          cache-dependency-path: android/musicdnet/go.sum
      - name: Build the engine for each platform
        working-directory: android/musicdnet
        run: |
          set -e
          V=$(node -p "require('../../package.json').version")
          mkdir -p ../../engine-out
          # Linux's.
          for A in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$A go build -trimpath -ldflags "-s -w -X main.version=$V" -o ../../engine-out/musicdnet-linux-$A .
            gzip -9 -f ../../engine-out/musicdnet-linux-$A
          done
          cd ../../engine-out
          sha256sum musicdnet-*.gz > SHA256SUMS
          echo "$V" > VERSION
          cat SHA256SUMS VERSION
      - name: Publish to the "engine" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! gh release view engine >/dev/null 2>&1; then
            gh release create engine --prerelease --latest=false --title "Tailscale engine (for in-place updates)" \
              --notes "The built-in Tailscale engine for MusicD Server installs updated from Settings. Updated on every change to main; not a MusicD release." \
              --target "${GITHUB_SHA}"
          fi
          gh release upload engine engine-out/* --clobber
