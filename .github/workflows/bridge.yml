name: Mandarin Bridge

# Mandarin Bridge (bridge/, items 278 and 281): the Android app that is a UPnP renderer playing through a USB DAC with
# Mandarin's own driver. Built whenever its files, the driver's (bridge/driver-files.txt and usb_jni.cc) or
# :core change, so a driver change is built for both apps in the pull request that makes it. A push to dev also puts
# the APK on the rolling "test-bridge" pre-release, at one fixed address, never "latest" (Mandarin's own
# releases are the latest, which its updater reads). Versions are cut by hand with bridge-release.yml; nothing
# here makes a tag.
on:
  push:
    branches: ["**"]
    paths: &paths
      - "bridge/**"
      - "android/core/**"
      - "android/app/src/main/java/com/musicd/server/android/UsbDac.kt"
      - "android/app/src/main/java/com/musicd/server/android/UsbDriver.kt"
      - "android/app/src/main/java/com/musicd/server/android/UsbAudioSink.kt"
      - "android/app/src/main/java/com/musicd/server/android/DsdExtractor.kt"
      - "android/app/src/main/java/com/musicd/server/android/DsdRenderer.kt"
      - "android/app/src/main/java/com/musicd/server/android/DspSink.kt"
      - "android/app/src/main/cpp/usb_jni.cc"
      - "android/app/src/main/res/xml/usb_device_filter.xml"
      - "android/build.gradle.kts"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# One run at a time for each branch; dev's is never cut short, so its pre-release always catches up (item 276).
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

defaults:
  run:
    working-directory: bridge/android

jobs:
  apk:
    name: Mandarin Bridge APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # The NDK and CMake build the driver's native side (android/app/src/main/cpp/usb_jni.cc); the versions match
      # bridge/android/app/build.gradle.kts.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}   # dev keeps the cache too (item 350)

      # The same signing secrets as Mandarin's app (MUSICD_KEYSTORE_BASE64, MUSICD_KEYSTORE_PASSWORD), as in the
      # app's own repository before it moved here; without them a build that may be published fails (item 364),
      # and only a pull request's, never published, is signed with the key committed in bridge/android/app.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Never published signed with the committed debug key (item 364, the security audit's tenth finding): anyone
            # can sign with it, and a phone would take such an APK as an update. Only a pull request's build, which is
            # never published (a fork's or Dependabot's, given no secrets), may use it.
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::error::MUSICD_KEYSTORE_BASE64 is not set: a build that may be published is never signed with the committed debug key."
              exit 1
            fi
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MUSICD_KEYSTORE_BASE64 is not set: a pull request's build, signed with the committed debug key and never published."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        env:
          MUSICD_KEYSTORE: ${{ steps.signing.outputs.path }}
          MUSICD_KEYSTORE_PASSWORD: ${{ secrets.MUSICD_KEYSTORE_PASSWORD }}
          MUSICD_KEY_ALIAS: musicd
        run: ../../.github/gradle-retry.sh :app:assembleRelease --no-daemon --stacktrace   # a failed download tried again (item 350)

      - name: Name the APK after the version
        id: name
        env:
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$HAVE_KEY" = "true" ]; then out="Mandarin-Bridge-${version}.apk"
          else out="Mandarin-Bridge-${version}-shared-key.apk"; fi
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.apk }}
          path: bridge/android/${{ steps.name.outputs.apk }}

      # dev's build at one fixed address: the "test-bridge" pre-release's one file, replaced each time.
      - name: Publish dev's APK to the "test-bridge" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
        run: |
          set -e
          cp "bridge/android/$APK" mandarin-bridge.apk
          if ! gh release view test-bridge >/dev/null 2>&1; then
            gh release create test-bridge --prerelease --latest=false --title "Mandarin Bridge — test build" \
              --notes "Mandarin Bridge as dev is now. Not a numbered release." --target "${GITHUB_SHA}"
          fi
          gh release edit test-bridge --prerelease --latest=false --notes "Mandarin Bridge from dev at ${GITHUB_SHA::7} ($APK), its driver Mandarin's own at the same commit. For testing only; not a release."
          # Its build and checksum beside it (item 291): what Mandarin's Settings → Updates and the Bridge's own update read.
          ./bridge/sidecar.sh mandarin-bridge.apk "$GITHUB_SHA" "$(grep -oP 'versionName = "\K[^"]+' bridge/android/app/build.gradle.kts)"
          gh release upload test-bridge mandarin-bridge.apk mandarin-bridge.apk.json --clobber
