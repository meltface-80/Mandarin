# Every version merged to main becomes a GitHub release — that is what the
# in-app updater (Settings → Check for updates) looks for. The release carries
# musicd-server-<version>.tar.gz: just the server (index.js, launcher.js,
# lib/, public/, package files), so an update downloads a few hundred KB
# rather than the whole repository with its APK. From v0.8.25 it carries
# Mandarin's C# server too, for each platform the image is built for
# (mandarin-server-linux-x64.gz, mandarin-server-linux-arm64.gz, and their
# SHA-256 sums in mandarin-server.sha256): an install updated from Settings
# fetches the one for its machine (lib/server/csharp-update.js). From v0.8.29
# it carries the Mac's too (mandarin-server-osx-arm64.gz, -osx-x64.gz), built
# on a Mac so that macOS will run them, for the Mac installer and its updates.
# From v0.8.31 nothing is released until CI has passed on the same commit,
# every job of it, the Mac's tests included (.github/wait-for-ci.sh).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # to see CI's runs (.github/wait-for-ci.sh)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # CI on this commit, passed: every test, the Mac's included (v0.8.31). The
  # jobs below wait for it, so a version whose tests fail is never released.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

  # Mandarin's C# server for Macs (v0.8.29), Apple silicon and Intel: built on
  # a Mac, where the SDK signs it (ad hoc, as macOS needs to run anything),
  # signed here if it wasn't, and each asked its version where it can run.
  macos:
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the C# server for Macs
        run: |
          set -e
          v=$(node -p "require('./package.json').version")
          mkdir -p out/csharp
          for rid in osx-arm64 osx-x64; do
            RID=$rid ./server/build.sh
            b="server/bin/$rid/mandarin-server"
            codesign --verify "$b" || codesign --force --sign - "$b"
            codesign --verify "$b"
            gzip -9 -c "$b" > "out/csharp/mandarin-server-$rid.gz"
          done
          test "$(server/bin/osx-arm64/mandarin-server --version)" = "$v"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(arch -x86_64 server/bin/osx-x64/mandarin-server --version)" = "$v"
          else
            echo "No Rosetta on this runner: the Intel build is signed but not run"
          fi
          ls -la out/csharp
      - uses: actions/upload-artifact@v4
        with:
          name: csharp-macos
          path: out/csharp/
          retention-days: 7

  release:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1

      # The audio engine and the C# server, built as CI builds them: on CI the
      # tests that need them fail rather than skip (test/engine.test.js,
      # test/srp.test.js), so without these no 0.8.x release got past its tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      - name: Build the C# server
        run: ./server/build.sh

      - name: Test before releasing
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Is this version released yet?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # A release made by hand has no update bundle: the updater would
            # fall back to the whole source tarball, APK and all.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "musicd-server-$version.tar.gz"; then
              echo "bundle=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no musicd-server-$version.tar.gz; it will be added"
              echo "bundle=false" >> "$GITHUB_OUTPUT"
            fi
            # Nor, made before v0.8.25 or by hand, the C# server for an update to fetch.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "mandarin-server.sha256"; then
              echo "csharp=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no C# server for in-app updates; it will be added"
              echo "csharp=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi

      # The Mac's, built in the job above (v0.8.29), beside the Linux ones
      # before the sums are made, so one sums file covers every build.
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.csharp == 'false'
        with:
          name: csharp-macos
          path: out/csharp

      # Mandarin's C# server for in-app updates (v0.8.25): built as the image
      # builds it (self-contained, one file) for both of the image's platforms,
      # arm64 cross-built here as the image does, each checked to say its version.
      - name: Build the C# server for in-app updates
        if: steps.v.outputs.csharp == 'false'
        run: |
          set -e
          v=${{ steps.v.outputs.version }}
          mkdir -p out/csharp
          for rid in linux-x64 linux-arm64; do
            RID=$rid ./server/build.sh
            gzip -9 -c "server/bin/$rid/mandarin-server" > "out/csharp/mandarin-server-$rid.gz"
          done
          test "$(server/bin/linux-x64/mandarin-server --version)" = "$v"
          (cd out/csharp && sha256sum mandarin-server-*.gz > mandarin-server.sha256 && cat mandarin-server.sha256)
          ls -la out/csharp

      - name: Build the update bundle and notes
        if: steps.v.outputs.bundle == 'false'
        run: |
          v=${{ steps.v.outputs.version }}
          mkdir -p out/musicd-server
          cp -r index.js launcher.js reset-password.js package.json package-lock.json lib public README.md CHANGELOG.md LICENSE out/musicd-server/
          tar -C out -czf "musicd-server-$v.tar.gz" musicd-server
          # This version's section of the changelog, without its heading.
          awk -v h="## v$v" '$0==h{on=1;next} /^## v/{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MusicD Server v$v" > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "musicd-server-$v.tar.gz" out/csharp/* \
            --target "$GITHUB_SHA" --title "MusicD Server v$v" --notes-file notes.md --latest

      - name: Add the update bundle to a release made by hand
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.bundle == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" "musicd-server-$v.tar.gz" --clobber

      - name: Add the C# server to a release without it
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.csharp == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" out/csharp/* --clobber
