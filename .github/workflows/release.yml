# A version becomes a GitHub release when asked for, never by itself (from
# v0.8.45, CLAUDE.md section 2): a tag vX.Y.Z pushed by hand on main's commit,
# or Run workflow on main. A tag must be the commit's own version
# (package.json). The release is what the
# in-app updater (Settings → Check for updates) looks for. The release carries
# musicd-server-<version>.tar.gz: the page and package.json (with v0.9.0 the
# Node server's index.js, launcher.js and lib/ left it), so an update downloads
# a few hundred KB rather than the whole repository with its APK. From v0.8.25
# it carries Mandarin's C# server too, for each platform Mandarin runs on
# (mandarin-server-linux-x64.gz, mandarin-server-linux-arm64.gz, and their
# SHA-256 sums in mandarin-server.sha256): an install updated from Settings
# fetches the one for its machine (server/Mandarin.Server/Admin/Updater.cs).
# Each signed with Mandarin's release key where there is one (item 371, .github/sign.sh): <file>.sig beside it;
# the bundle too (the audit's I-H3), which the updater checks before it unpacks it.
# From v0.8.31 nothing is released until CI has passed on the same commit,
# every job of it (.github/wait-for-ci.sh).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # to see CI's runs (.github/wait-for-ci.sh)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # CI on this commit, passed: every test (v0.8.31). The
  # jobs below wait for it, so a version whose tests fail is never released.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm

      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          # A cached binary that doesn't run is fetched again, not passed on.
          if ! ~/ffmpeg-static/ffmpeg -version >/dev/null 2>&1; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          v=$(~/ffmpeg-static/ffmpeg -version)
          echo "${v%%$'\n'*}"
      # pdftoppm, for the booklet tests (test/booklets-csharp.test.js), as CI installs it.
      - name: Install poppler
        timeout-minutes: 15
        run: .github/install-poppler.sh   # other mirrors where Ubuntu's own are out

      # The audio engine and the C# server, built as CI builds them: on CI the
      # tests that need them fail rather than skip (test/Mandarin.Tests/EngineTests.cs,
      # test/Mandarin.Tests/SrpTests.cs), so without these no 0.8.x release got past its tests.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      # Mandarin Bridge for Linux (item 282), played to end to end by test/bridge-linux.test.js, and
      # SQ-tool's numpy (item 288), which Mandarin starts in test/sq-tool.test.js: as CI makes its runner
      # ready (test/release-prepares.test.js); without them no v1.2.0 release got past its tests (item 295).
      - name: Build Mandarin Bridge for Linux
        run: ./bridge/linux/build.sh
      - name: Build the C# server
        run: ./server/build.sh
      - name: numpy
        run: python3 -m pip install --quiet numpy

      # As CI runs them (item 175): the tests that failed said again at the end
      # (.github/failed-tests.sh), and their files run once more on their own
      # (.github/retry-failed.sh). A file that passes then failed only under
      # load, a warning on the run; one that fails again stops the release.
      - name: Test before releasing
        timeout-minutes: 25
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          if ! npm test 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            .github/failed-tests.sh "$RUNNER_TEMP/tests.log"
            .github/retry-failed.sh "$RUNNER_TEMP/tests.log"
          fi
          .github/csharp-tests.sh

      - name: Is this version released yet?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not this commit's version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # A release made by hand has no update bundle, and one made before
            # the audit's I-H3 no signature for it: an install that checks it
            # (Admin/Updater.Bundle.cs) would refuse the update. Both made again.
            names=$(gh release view "v$version" --json assets -q '.assets[].name')
            if grep -qx "musicd-server-$version.tar.gz" <<<"$names" && grep -qx "musicd-server-$version.tar.gz.sig" <<<"$names"; then
              echo "bundle=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no musicd-server-$version.tar.gz with its signature; they will be added"
              echo "bundle=false" >> "$GITHUB_OUTPUT"
            fi
            # Nor, made before v0.8.25 or by hand, the C# server for an update to fetch.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "mandarin-server.sha256"; then
              echo "csharp=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no C# server for in-app updates; it will be added"
              echo "csharp=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi

      # Mandarin's C# server for in-app updates (v0.8.25): self-contained, one
      # file, for x64 and arm64, arm64 cross-built here, each checked to say its
      # version. The Linux installer and Mandarin OS install it from here too.
      - name: Build the C# server for in-app updates
        if: steps.v.outputs.csharp == 'false'
        env:
          # Each signed with Mandarin's release key (item 371): <file>.sig beside it, which the updater checks.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -e
          v=${{ steps.v.outputs.version }}
          # As dev's test builds are made (server-dev.yml): .github/server-assets.sh.
          .github/server-assets.sh program "$v" out/csharp
          .github/sign.sh out/csharp/mandarin-server-*.gz
          ls -la out/csharp

      - name: Build the update bundle and notes
        if: steps.v.outputs.bundle == 'false'
        env:
          # Signed as the program is (the audit's I-H3): the page, package.json and SQ-tool's Python are the server's
          # code too, and the updater checks <bundle>.sig before it unpacks anything.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -e
          v=${{ steps.v.outputs.version }}
          # The page, package.json, and SQ-tool's code (item 288), so an update made from Settings brings it.
          .github/server-assets.sh bundle "$v" .
          .github/sign.sh "musicd-server-$v.tar.gz"
          # This version's section of the changelog, without its heading: its summary and short lines, up to its own
          # "### Every change" (item 344), then where every change is.
          awk -v h="## v$v" '$0==h{on=1;next} /^###? /{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Mandarin Server & Remote v$v" > notes.md
          printf '\nEvery change: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "musicd-server-$v.tar.gz" "musicd-server-$v.tar.gz.sig" out/csharp/* \
            --target "$GITHUB_SHA" --title "Mandarin Server & Remote v$v" --notes-file notes.md --latest

      - name: Add the update bundle to a release made by hand
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.bundle == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" "musicd-server-$v.tar.gz" "musicd-server-$v.tar.gz.sig" --clobber

      - name: Add the C# server to a release without it
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.csharp == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" out/csharp/* --clobber
