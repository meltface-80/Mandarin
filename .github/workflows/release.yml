# A version becomes a GitHub release when asked for, never by itself (from
# v0.8.45, CLAUDE.md section 2): a tag vX.Y.Z pushed by hand on main's commit,
# or Run workflow on main. A tag must be the commit's own version
# (package.json). The release is what the
# in-app updater (Settings → Check for updates) looks for. The release carries
# musicd-server-<version>.tar.gz: the page and package.json (with v0.9.0 the
# Node server's index.js, launcher.js and lib/ left it), so an update downloads
# a few hundred KB rather than the whole repository with its APK. From v0.8.25
# it carries Mandarin's C# server too, for each platform the image is built
# for (mandarin-server-linux-x64.gz, mandarin-server-linux-arm64.gz, and their
# SHA-256 sums in mandarin-server.sha256): an install updated from Settings
# fetches the one for its machine (server/Mandarin.Server/Admin/Updater.cs).
# A Mac's too (mandarin-server-osx-arm64.gz, -osx-x64.gz: v0.8.29 to v1.0.2,
# and again from item 153), added by the mac job once the Mac's tests pass.
# From v0.8.31 nothing is released until CI has passed on the same commit,
# every job of it (.github/wait-for-ci.sh).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # to see CI's runs (.github/wait-for-ci.sh)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # CI on this commit, passed: every test (v0.8.31). The
  # jobs below wait for it, so a version whose tests fail is never released.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1
      # pdftoppm, for the booklet tests (test/booklets-csharp.test.js), as CI installs it.
      - name: Install poppler
        timeout-minutes: 5
        run: |
          command -v pdftoppm >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils; }
          pdftoppm -v

      # The audio engine and the C# server, built as CI builds them: on CI the
      # tests that need them fail rather than skip (test/Mandarin.Tests/EngineTests.cs,
      # test/Mandarin.Tests/SrpTests.cs), so without these no 0.8.x release got past its tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      - name: Build the C# server
        run: ./server/build.sh

      # As CI runs them (item 175): the tests that failed said again at the end
      # (.github/failed-tests.sh), and their files run once more on their own
      # (.github/retry-failed.sh). A file that passes then failed only under
      # load, a warning on the run; one that fails again stops the release.
      - name: Test before releasing
        timeout-minutes: 25
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          if ! npm test 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            .github/failed-tests.sh "$RUNNER_TEMP/tests.log"
            .github/retry-failed.sh "$RUNNER_TEMP/tests.log"
          fi
          .github/csharp-tests.sh

      - name: Is this version released yet?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not this commit's version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # A release made by hand has no update bundle: the updater would
            # fall back to the whole source tarball, APK and all.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "musicd-server-$version.tar.gz"; then
              echo "bundle=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no musicd-server-$version.tar.gz; it will be added"
              echo "bundle=false" >> "$GITHUB_OUTPUT"
            fi
            # Nor, made before v0.8.25 or by hand, the C# server for an update to fetch.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "mandarin-server.sha256"; then
              echo "csharp=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no C# server for in-app updates; it will be added"
              echo "csharp=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi

      # Mandarin's C# server for in-app updates (v0.8.25): built as the image
      # builds it (self-contained, one file) for both of the image's platforms,
      # arm64 cross-built here as the image does, each checked to say its version.
      - name: Build the C# server for in-app updates
        if: steps.v.outputs.csharp == 'false'
        run: |
          set -e
          v=${{ steps.v.outputs.version }}
          mkdir -p out/csharp
          for rid in linux-x64 linux-arm64; do
            RID=$rid ./server/build.sh
            gzip -9 -c "server/bin/$rid/mandarin-server" > "out/csharp/mandarin-server-$rid.gz"
          done
          test "$(server/bin/linux-x64/mandarin-server --version)" = "$v"
          (cd out/csharp && sha256sum mandarin-server-*.gz > mandarin-server.sha256 && cat mandarin-server.sha256)
          ls -la out/csharp

      - name: Build the update bundle and notes
        if: steps.v.outputs.bundle == 'false'
        run: |
          v=${{ steps.v.outputs.version }}
          mkdir -p out/musicd-server
          cp -r package.json public README.md CHANGELOG.md LICENSE out/musicd-server/
          tar -C out -czf "musicd-server-$v.tar.gz" musicd-server
          # This version's section of the changelog, without its heading.
          awk -v h="## v$v" '$0==h{on=1;next} /^## v/{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MusicD Server v$v" > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "musicd-server-$v.tar.gz" out/csharp/* \
            --target "$GITHUB_SHA" --title "MusicD Server v$v" --notes-file notes.md --latest

      - name: Add the update bundle to a release made by hand
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.bundle == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" "musicd-server-$v.tar.gz" --clobber

      - name: Add the C# server to a release without it
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.csharp == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" out/csharp/* --clobber

  # A Mac's builds (item 153): osx-arm64 and osx-x64, built on a Mac and signed
  # ad hoc there (macOS runs nothing unsigned), added to the release with their
  # sums beside Linux's. Only these wait for the Mac's tests (mac.yml): Linux's
  # release above doesn't, so a Mac that is slow to come never holds it up.
  mac:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Mac's tests to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA" mac.yml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and add the Mac's C# server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          v=$(node -p "require('./package.json').version")
          names=$(gh release view "v$v" --json assets -q '.assets[].name')
          if grep -qx "mandarin-server-osx-arm64.gz" <<<"$names" && grep -qx "mandarin-server-osx-x64.gz" <<<"$names"; then
            echo "v$v has the Mac's builds already"; exit 0
          fi
          mkdir -p out/mac
          for rid in osx-arm64 osx-x64; do
            RID=$rid ./server/build.sh
            codesign --force --sign - "server/bin/$rid/mandarin-server"
            codesign --verify "server/bin/$rid/mandarin-server"
            gzip -9 -c "server/bin/$rid/mandarin-server" > "out/mac/mandarin-server-$rid.gz"
          done
          test "$(server/bin/osx-arm64/mandarin-server --version)" = "$v"
          # The sums: Linux's as released, and the Mac's added.
          gh release download "v$v" -p mandarin-server.sha256 -D out/sums
          grep -v ' mandarin-server-osx-' out/sums/mandarin-server.sha256 > out/mac/mandarin-server.sha256 || true
          (cd out/mac && shasum -a 256 mandarin-server-osx-*.gz >> mandarin-server.sha256 && cat mandarin-server.sha256)
          gh release upload "v$v" out/mac/* --clobber
