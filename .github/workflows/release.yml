# Every version merged to main becomes a GitHub release — that is what the
# in-app updater (Settings → Check for updates) looks for. The release carries
# musicd-server-<version>.tar.gz: just the server (index.js, launcher.js,
# lib/, public/, package files), so an update downloads a few hundred KB
# rather than the whole repository with its APK.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1

      # The audio engine and the C# server, built as CI builds them: on CI the
      # tests that need them fail rather than skip (test/engine.test.js,
      # test/srp.test.js), so without these no 0.8.x release got past its tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      - name: Build the C# server
        run: ./server/build.sh

      - name: Test before releasing
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Is this version released yet?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # A release made by hand has no update bundle: the updater would
            # fall back to the whole source tarball, APK and all.
            if gh release view "v$version" --json assets -q '.assets[].name' | grep -qx "musicd-server-$version.tar.gz"; then
              echo "bundle=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version has no musicd-server-$version.tar.gz; it will be added"
              echo "bundle=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the update bundle and notes
        if: steps.v.outputs.bundle == 'false'
        run: |
          v=${{ steps.v.outputs.version }}
          mkdir -p out/musicd-server
          cp -r index.js launcher.js reset-password.js package.json package-lock.json lib public README.md CHANGELOG.md LICENSE out/musicd-server/
          tar -C out -czf "musicd-server-$v.tar.gz" musicd-server
          # This version's section of the changelog, without its heading.
          awk -v h="## v$v" '$0==h{on=1;next} /^## v/{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MusicD Server v$v" > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "musicd-server-$v.tar.gz" \
            --target "$GITHUB_SHA" --title "MusicD Server v$v" --notes-file notes.md --latest

      - name: Add the update bundle to a release made by hand
        if: steps.v.outputs.exists == 'true' && steps.v.outputs.bundle == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" "musicd-server-$v.tar.gz" --clobber
