name: CI

on:
  push:
    branches: ["**"]
  # By hand too ("Run workflow", any branch). Linux only: Mac support was
  # dropped in v1.0.3, and with it the Mac's tests, the pull request runs into
  # main and the weekly run that existed for them.
  workflow_dispatch:

jobs:
  # The quality gates (docs/quality-plan.md): the file-length ratchet, lint
  # against its baseline, and the type check. A minute; red blocks the merge.
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The app's own dependencies first: the checked modules import them, and tsc
      # has to find them to read their shapes.
      - run: npm ci --no-audit --no-fund
      - name: The development tools (tools/lint only, never the app's dependencies)
        run: npm run tools
      - name: File length, @ts-check and tsc, ESLint against its suppressions
        run: npm run gates
      - name: The gates' own tests
        run: node --test test/quality-gates.test.js

  # The suite, in parts that run at once (v0.8.49): the test files dealt out to
  # three jobs (node's --test-shard, each file in one of them), so the whole run
  # takes the time of a third of it rather than nine minutes end to end. Since
  # v0.8.50 (stage 7) the tests start the C# server alone (test/server.js);
  # since v0.9.0 there is no Node server. Node runs the tests themselves.
  test:
    name: test (${{ matrix.node-version }}, part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A runner whose apt mirror stalls used to sit in "Install ffmpeg" for the
    # whole hour; nothing here should take half of that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: "22", shard: "1/3" }
          - { node-version: "22", shard: "2/3" }
          - { node-version: "22", shard: "3/3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1
      # poppler (v0.8.33): the C# server draws an album's booklet with it
      # (test/booklets-csharp.test.js). The runner may have it already.
      - name: Install poppler
        timeout-minutes: 5
        run: |
          command -v pdftoppm >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils; }
          pdftoppm -v
      - run: npm ci --no-audit --no-fund
      # Mandarin's audio engine (engine/, C#): built ahead of time to one
      # native program, then tested with the rest (test/engine.test.js).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The packages the two builds restore, kept between runs (v0.8.49).
      - name: Restore the .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Mandarin.Server/*.csproj', 'engine/Mandarin.Audio/*.csproj') }}
      - name: Build the audio engine
        run: ./engine/build.sh
      # Mandarin's server in C# (server/, v0.8.1): the server the tests start
      # (test/server.js).
      - name: Build the C# server
        run: ./server/build.sh
      - name: Syntax check of the page
        run: node --check public/app.js
      # Kept to a file as well: the tests that failed are said again at the end,
      # where a log read from its tail finds them, and their files run once more
      # on their own (.github/retry-failed.sh): a pass then is a warning on the
      # run, a race on a busy runner to fix in its turn; a failure again is red.
      - name: Tests (including the end-to-end run against a fake Sonos household)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          npm run test:shard 2>&1 | tee "$RUNNER_TEMP/tests.log" && exit 0
          .github/failed-tests.sh "$RUNNER_TEMP/tests.log"
          .github/retry-failed.sh "$RUNNER_TEMP/tests.log"
      # The suite in C# (test/Mandarin.Tests, v1.0.6), taking over from the Node
      # suite above file by file: its classes dealt out to the same three parts,
      # a failure run once more on its own (.github/csharp-tests.sh).
      - name: Tests in C# (test/Mandarin.Tests)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: .github/csharp-tests.sh "$TEST_SHARD"

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: musicd-server:ci
      - name: Smoke test the image
        run: |
          mkdir -p /tmp/music
          docker run -d --name smoke -p 3500:3500 -v /tmp/music:/music:ro musicd-server:ci
          for i in $(seq 1 30); do curl -fs localhost:3500/api/health && break; sleep 1; done
          curl -fs localhost:3500/api/health | tee /dev/stderr | grep -q '"ffmpeg":true'
          # The audio engine is in the image, at the server's version.
          V=$(node -p "require('./package.json').version")
          curl -fs localhost:3500/api/health | grep -q "\"audio_engine\":\"$V\""
          docker run --rm --entrypoint /app/engine/bin/mandarin-audio musicd-server:ci --version
          # The C# server says its version, as an update checks a new one before putting it in place (v0.8.25).
          test "$(docker run --rm --entrypoint /app/server/bin/mandarin-server musicd-server:ci --version)" = "$V"
          # The image's health check is the C# server asking itself (v0.8.50): 0 with the server
          # up on PORT, 1 with nothing on the port it is told.
          docker exec smoke /app/server/bin/mandarin-server --health | grep -q '"ok":true'
          if docker exec -e PORT=9 smoke /app/server/bin/mandarin-server --health; then echo "--health passed with nothing on port 9"; exit 1; fi
          # Measure ReplayGain works with the image's own ffmpeg: its options, as
          # the server asks, give a loudness (v0.8.24: ffmpeg 5.1 refused framelog=quiet).
          F=$(sed -n 's/^ *\(private \|public \|internal \)\?const string Filter = "\(.*\)";$/\2/p' server/Mandarin.Server/Identify/Loudness.cs)
          test -n "$F"
          docker run --rm --entrypoint ffmpeg musicd-server:ci -hide_banner -nostats -nostdin -f lavfi -i sine=frequency=440:duration=3 \
            -map 0:a:0 -vn -af "$F" -f null - 2>&1 | tee /dev/stderr | grep -Eq "I: +-[0-9.]+ LUFS"
          # The image's ffmpeg draws text with fontconfig's sans-serif (v0.8.34): an album
          # with no cover is drawn by the C# server with it (CoversDrawn.cs). The test jobs'
          # static ffmpeg has no drawtext, so there it is drawn without its title.
          docker run --rm --entrypoint ffmpeg musicd-server:ci -hide_banner -filters | grep -Eq "\sdrawtext\s"
          docker run --rm --entrypoint ffmpeg musicd-server:ci -hide_banner -v error -nostdin -f lavfi -i color=c=black:s=64x64:d=1 \
            -vf "drawtext=text=A:font=sans-serif:fontsize=40:fontcolor=white:x=10:y=10" -frames:v 1 -f null -
          # The C# server answers on the port, and there is no Node.js in the image (v0.9.0).
          curl -fsI localhost:3500/api/health | grep -i "^x-mandarin-server: C#"
          curl -fs localhost:3500/server-info | grep -q '"server":"C#"'
          if docker run --rm --entrypoint sh musicd-server:ci -c 'command -v node || test -e /app/node_modules || test -e /app/index.js'; then echo "Node.js is still in the image"; exit 1; fi
          # A new install asks for its account first: the page is the sign-in page,
          # and the API is closed until then.
          curl -fsL localhost:3500/ | grep -q "Create your account"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3500/api/status)" = "401"
          docker logs smoke
          docker rm -f smoke
