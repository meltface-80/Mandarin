name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A runner whose apt mirror stalls used to sit in "Install ffmpeg" for the
    # whole hour; nothing here should take a quarter of that.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1
      - run: npm ci --no-audit --no-fund
      # Mandarin's audio engine (engine/, C#): built ahead of time to one
      # native program, then tested with the rest (test/engine.test.js).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      # Mandarin's server in C# (server/, v0.8.1): on Node 22 every test's
      # server sits behind it, as in the image (test/setup.js, MANDARIN_FRONT);
      # on Node 20 the suite talks to the Node server directly. Both must pass.
      - name: Build the C# server
        run: ./server/build.sh
      - name: Syntax check
        run: |
          node --check index.js
          node --check public/app.js
          for f in lib/*.js lib/*/*.js; do node --check "$f"; done
      - name: Tests (including the end-to-end run against a fake Sonos household)
        env:
          MANDARIN_FRONT: ${{ matrix.node-version == '22' && '1' || '' }}
        run: npm test

  # A Mac (v0.8.29): the C# server built for it and the whole suite through
  # it, as the Mac installer runs Mandarin. GitHub's Mac runners are Apple
  # silicon; ffmpeg from Homebrew, as the installer has it.
  macos:
    name: Tests on a Mac
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ffmpeg
          ffmpeg -version | head -1
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the C# server
        run: |
          ./server/build.sh
          codesign --verify server/bin/mandarin-server && echo "signed to run here"
      # The installer's own step (tools/mac/install.sh fetch_server), on a Mac:
      # this build served as a release, fetched, checked, signed and placed;
      # and with a sum that doesn't match, nothing placed.
      - name: The installer fetches the Mac's C# server
        run: |
          set -e
          v=$(node -p "require('./package.json').version")
          rid=osx-$(uname -m | sed 's/x86_64/x64/')
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel/v$v" "$rel/v0.0.1"
          gzip -9 -c server/bin/mandarin-server > "$rel/v$v/mandarin-server-$rid.gz"
          (cd "$rel/v$v" && shasum -a 256 "mandarin-server-$rid.gz" > mandarin-server.sha256)
          cp "$rel/v$v/mandarin-server-$rid.gz" "$rel/v0.0.1/"
          echo "$(printf '0%.0s' $(seq 64))  mandarin-server-$rid.gz" > "$rel/v0.0.1/mandarin-server.sha256"
          python3 -m http.server 8799 --bind 127.0.0.1 --directory "$rel" >/dev/null 2>&1 &
          sleep 2
          export MANDARIN_INSTALL_FUNCTIONS_ONLY=1 MANDARIN_RELEASES=http://127.0.0.1:8799
          bash -c 'source tools/mac/install.sh; fetch_server "$1" "$2"; test -n "$SERVER"; test "$("$SERVER" --version)" = "$2"; codesign --verify "$SERVER"' _ "$RUNNER_TEMP/app" "$v"
          test "$(cat "$RUNNER_TEMP/app/server/bin/mandarin-server.version")" = "$v"
          bash -c 'source tools/mac/install.sh; fetch_server "$1" "$2"; test -z "$SERVER"' _ "$RUNNER_TEMP/bad" "0.0.1"
          test ! -e "$RUNNER_TEMP/bad/server/bin/mandarin-server"
          echo "fetched, checked and placed; a wrong sum placed nothing"
      - name: Tests, through the C# server
        env:
          MANDARIN_FRONT: "1"
        run: npm test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: musicd-server:ci
      - name: Smoke test the image
        run: |
          mkdir -p /tmp/music
          docker run -d --name smoke -p 3500:3500 -v /tmp/music:/music:ro musicd-server:ci
          for i in $(seq 1 30); do curl -fs localhost:3500/api/health && break; sleep 1; done
          curl -fs localhost:3500/api/health | tee /dev/stderr | grep -q '"ffmpeg":true'
          # The audio engine is in the image, at the server's version.
          V=$(node -p "require('./package.json').version")
          curl -fs localhost:3500/api/health | grep -q "\"audio_engine\":\"$V\""
          docker run --rm --entrypoint /app/engine/bin/mandarin-audio musicd-server:ci --version
          # The C# server says its version, as an update checks a new one before putting it in place (v0.8.25).
          test "$(docker run --rm --entrypoint /app/server/bin/mandarin-server musicd-server:ci --version)" = "$V"
          # Measure ReplayGain works with the image's own ffmpeg: its options, as
          # the servers ask, give a loudness (v0.8.24: ffmpeg 5.1 refused framelog=quiet).
          F=$(sed -n 's/^const FILTER = "\(.*\)";$/\1/p' lib/loudness.js)
          test -n "$F"
          grep -q "const string Filter = \"$F\";" server/Mandarin.Server/Identify/Loudness.cs
          docker run --rm --entrypoint ffmpeg musicd-server:ci -hide_banner -nostats -nostdin -f lavfi -i sine=frequency=440:duration=3 \
            -map 0:a:0 -vn -af "$F" -f null - 2>&1 | tee /dev/stderr | grep -Eq "I: +-[0-9.]+ LUFS"
          # The C# server answers on the port, with the Node server behind it.
          curl -fsI localhost:3500/api/health | grep -i "^x-mandarin-server: C#"
          curl -fs localhost:3500/server-info | grep -q '"server":"C#"'
          # A new install asks for its account first: the page is the sign-in page,
          # and the API is closed until then.
          curl -fsL localhost:3500/ | grep -q "Create your account"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3500/api/status)" = "401"
          docker logs smoke
          docker rm -f smoke
