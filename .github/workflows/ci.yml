name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A runner whose apt mirror stalls used to sit in "Install ffmpeg" for the
    # whole hour; nothing here should take a quarter of that.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if [ ! -x ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ~/ffmpeg-static/ffmpeg -version | head -1
      - run: npm ci --no-audit --no-fund
      # Mandarin's audio engine (engine/, C#): built ahead of time to one
      # native program, then tested with the rest (test/engine.test.js).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the audio engine
        run: ./engine/build.sh
      - name: Syntax check
        run: |
          node --check index.js
          node --check public/app.js
          for f in lib/*.js lib/*/*.js; do node --check "$f"; done
      - name: Tests (including the end-to-end run against a fake Sonos household)
        run: npm test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: musicd-server:ci
      - name: Smoke test the image
        run: |
          mkdir -p /tmp/music
          docker run -d --name smoke -p 3500:3500 -v /tmp/music:/music:ro musicd-server:ci
          for i in $(seq 1 30); do curl -fs localhost:3500/api/health && break; sleep 1; done
          curl -fs localhost:3500/api/health | tee /dev/stderr | grep -q '"ffmpeg":true'
          # The audio engine is in the image, at the server's version.
          V=$(node -p "require('./package.json').version")
          curl -fs localhost:3500/api/health | grep -q "\"audio_engine\":\"$V\""
          docker run --rm --entrypoint /app/engine/bin/mandarin-audio musicd-server:ci --version
          # A new install asks for its account first: the page is the sign-in page,
          # and the API is closed until then.
          curl -fsL localhost:3500/ | grep -q "Create your account"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3500/api/status)" = "401"
          docker logs smoke
          docker rm -f smoke
