name: CI

on:
  push:
    branches: ["**"]
  # By hand too ("Run workflow", any branch).
  workflow_dispatch:
  # Mandarin OS's workflow runs the suite again with the OS's own ffmpeg (os/ffmpeg, item 389): audio and pictures
  # alone, built from Debian's source. Whatever Mandarin needs of ffmpeg must be in it, or this is red.
  workflow_call:
    inputs:
      ffmpeg:
        description: "static (the usual build) or mandarin-os (os/ffmpeg/build.sh)"
        type: string
        default: static

jobs:
  # The quality gates (docs/quality-plan.md): the file-length ratchet, lint
  # against its baseline, and the type check. A minute; red blocks the merge.
  check:
    name: Quality gates
    if: inputs.ffmpeg != 'mandarin-os'   # Mandarin OS's run is the suite alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: the screens contract's gaps list only shrinks, held
      # against where the branch left dev (tools/quality/parity.js).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # Commits and trees, not every file's every version: the history carries each APK published,
          # gigabytes, which ran past the gates' 10 minutes (item 222). A file of an older commit is
          # fetched when it is read.
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
      # The app's own dependencies first: the checked modules import them, and tsc
      # has to find them to read their shapes.
      - run: npm ci --no-audit --no-fund
      - name: The development tools (tools/lint only, never the app's dependencies)
        run: npm run tools
      - name: File length, @ts-check and tsc, ESLint against its suppressions, the screens contract
        run: npm run gates
        env:
          PARITY_REQUIRE_BASE: "1"
      - name: The gates' own tests
        run: node --test test/quality-gates.test.js test/parity-gate.test.js

  # SQ-tool's own tests (sq-tool/, item 288): the recorder and comparer Mandarin serves at /sq-tool/,
  # tested as it was standalone, Python 3 with numpy.
  sqtool:
    name: SQ-tool's own tests
    if: inputs.ffmpeg != 'mandarin-os'   # Mandarin OS's run is the suite alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: numpy
        run: python3 -m pip install --quiet numpy
      # ffmpeg (item 413): comparing two songs at different sample rates resamples one with its soxr; the same
      # static build as the suite's below, from the same cache.
      - name: Restore ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Install ffmpeg
        run: |
          set -e
          if ! ~/ffmpeg-static/ffmpeg -version >/dev/null 2>&1; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          v=$(~/ffmpeg-static/ffmpeg -version)
          echo "${v%%$'\n'*}"
      - name: Tests (sq-tool/tests)
        working-directory: sq-tool
        run: python3 -m unittest discover -s tests

  # The suite, in parts that run at once (v0.8.49): the test files dealt out to
  # three jobs (node's --test-shard, each file in one of them), so the whole run
  # takes the time of a third of it rather than nine minutes end to end. Since
  # v0.8.50 (stage 7) the tests start the C# server alone (test/server.js);
  # since v0.9.0 there is no Node server. Node runs the tests themselves.
  test:
    name: test (${{ matrix.node-version }}, part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A runner whose apt mirror stalls used to sit in "Install ffmpeg" for the
    # whole hour; nothing here should take half of that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: "22", shard: "1/3" }
          - { node-version: "22", shard: "2/3" }
          - { node-version: "22", shard: "3/3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # A static ffmpeg build, fetched straight from its publisher with a
      # timeout and kept in the Actions cache: not apt (apt-get update can
      # hang on a slow mirror, with no timeout of its own), and not a
      # third-party action (one broke when the build's readme changed shape).
      - name: Restore ffmpeg
        if: inputs.ffmpeg != 'mandarin-os'
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-release-v1
      - name: Mandarin OS's ffmpeg (os/ffmpeg/build.sh)
        if: inputs.ffmpeg == 'mandarin-os'
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nasm pkg-config libsoxr-dev libopus-dev libmp3lame-dev libgnutls28-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev zlib1g-dev libbz2-dev
          ./os/ffmpeg/build.sh "$HOME/os-ffmpeg"
          echo "$HOME/os-ffmpeg/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/os-ffmpeg/lib" >> "$GITHUB_ENV"
          echo "MANDARIN_OS_FFMPEG=1" >> "$GITHUB_ENV"   # test/os-ffmpeg.test.js: everything Mandarin asks of it
          "$HOME/os-ffmpeg/bin/ffmpeg" -version | head -n 1 || LD_LIBRARY_PATH="$HOME/os-ffmpeg/lib" "$HOME/os-ffmpeg/bin/ffmpeg" -version | head -n 1
      - name: Install ffmpeg
        if: inputs.ffmpeg != 'mandarin-os'
        run: |
          set -e
          # A cached binary that doesn't run is fetched again, not passed on.
          if ! ~/ffmpeg-static/ffmpeg -version >/dev/null 2>&1; then
            mkdir -p ~/ffmpeg-static
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C ~/ffmpeg-static --wildcards '*/ffmpeg' '*/ffprobe'
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          v=$(~/ffmpeg-static/ffmpeg -version)
          echo "${v%%$'\n'*}"
      # poppler (v0.8.33): the C# server draws an album's booklet with it
      # (test/booklets-csharp.test.js). The runner may have it already.
      - name: Install poppler
        timeout-minutes: 15
        run: .github/install-poppler.sh   # other mirrors where Ubuntu's own are out
      - run: npm ci --no-audit --no-fund
      # Mandarin's audio engine (engine/, C#): built ahead of time to one
      # native program, then tested with the rest (test/Mandarin.Tests/EngineTests.cs).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
        with:
          dotnet-version: "10.0.x"
      # The packages the two builds restore, kept between runs (v0.8.49).
      - name: Restore the .NET packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Mandarin.Server/*.csproj', 'engine/Mandarin.Audio/*.csproj', 'bridge/linux/Mandarin.Bridge/*.csproj') }}
      - name: Build the audio engine
        run: ./engine/build.sh
      # Mandarin Bridge for Linux (bridge/linux, item 282): played to end to end by test/bridge-linux.test.js.
      - name: Build Mandarin Bridge for Linux
        run: ./bridge/linux/build.sh
      # Mandarin's server in C# (server/, v0.8.1): the server the tests start
      # (test/server.js).
      - name: Build the C# server
        run: ./server/build.sh
      - name: Syntax check of the page
        run: node --check public/app.js
      # SQ-tool's numpy (item 288): Mandarin starts it in its tests (test/sq-tool.test.js), as an install does.
      - name: numpy
        run: python3 -m pip install --quiet numpy
      # Kept to a file as well: the tests that failed are said again at the end,
      # where a log read from its tail finds them, and their files run once more
      # on their own (.github/retry-failed.sh): a pass then is a warning on the
      # run, a race on a busy runner to fix in its turn; a failure again is red.
      - name: Tests (including the end-to-end run against a fake Sonos household)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          npm run test:shard 2>&1 | tee "$RUNNER_TEMP/tests.log" && exit 0
          .github/failed-tests.sh "$RUNNER_TEMP/tests.log"
          .github/retry-failed.sh "$RUNNER_TEMP/tests.log"
      # The suite in C# (test/Mandarin.Tests, v1.0.6), taking over from the Node
      # suite above file by file: its classes dealt out to the same three parts,
      # a failure run once more on its own (.github/csharp-tests.sh).
      - name: Tests in C# (test/Mandarin.Tests)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: .github/csharp-tests.sh "$TEST_SHARD"
