name: Android

# The APK is built here: GitHub's runners carry the Android SDK, so this is the
# shortest path from a commit to something installable. Every push produces
# an artifact, and pushes to main publish the APK into dist/ when versionName
# changes.
on:
  push:
    branches: ["**"]
    paths: ["android/**", "public/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "public/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the core test suite
        run: ./gradlew :core:test --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test

  # The Tailscale engine the app runs (android/musicdnet): its tests drive it
  # the way the app does, over a private tailnet made on the runner.
  engine:
    name: Tailscale engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/musicdnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/musicdnet/go.mod
          cache-dependency-path: android/musicdnet/go.sum
      - run: go vet ./...
      - run: go test -count=1 -v ./...

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: [core, engine]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Not `tools`: the legacy SDK Tools package is obsolete and fails to
      # download often enough to take a build down with it.
      # The NDK and CMake build the app's native code (Media3's Opus decoder
      # over libopus, android/app/src/main/cpp); the versions match
      # android/app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/musicdnet/go.mod
          cache-dependency-path: android/musicdnet/go.sum
      # Plain Go, no NDK: Android on 64-bit ARM links without C tools.
      - name: Build the Tailscale engine
        working-directory: android/musicdnet
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' ../app/build.gradle.kts)
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=$version" \
            -o ../app/src/main/jniLibs/arm64-v8a/libmusicdnet.so .
          ls -la ../app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4

      # The signing key comes from repository secrets — the same two as
      # Android Random Remote (MUSICD_KEYSTORE_BASE64, MUSICD_KEYSTORE_PASSWORD).
      # Without them the (release) APK is signed with the key committed in
      # android/app (musicd-debug.keystore) — the same key every build, so each
      # one updates the last in place.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MUSICD_KEYSTORE_BASE64 is not set: signed with the committed debug key (updates install in place)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musicd-release.jks"
          echo "path=$RUNNER_TEMP/musicd-release.jks" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        env:
          MUSICD_KEYSTORE: ${{ steps.signing.outputs.path }}
          MUSICD_KEYSTORE_PASSWORD: ${{ secrets.MUSICD_KEYSTORE_PASSWORD }}
          MUSICD_KEY_ALIAS: musicd
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        # Always the release build (v0.6.10): optimised and not debuggable.
        # Without the secrets it's signed with the committed key, the same
        # as every build before it, so it installs over them in place.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK after the version
        id: name
        env:
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # "-shared-key": signed with the committed key rather than a private release key.
          if [ "$HAVE_KEY" = "true" ]; then out="musicd-server-android-${version}.apk"
          else out="musicd-server-android-${version}-shared-key.apk"; fi
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/${{ steps.name.outputs.apk }}

      # A test branch's app (v0.8.0 on): a direct download for the phone, from
      # the rolling "test-android" pre-release, at one fixed address. Never
      # "latest", and the app's own update check reads main's dist/, so
      # nothing offers it to anyone who didn't fetch it.
      - name: Publish a test branch's APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/v0.8')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
        run: |
          set -e
          cp "android/$APK" mandarin-android-test.apk
          branch="${GITHUB_REF#refs/heads/}"
          if ! gh release view test-android >/dev/null 2>&1; then
            gh release create test-android --prerelease --latest=false --title "Android app — test build" \
              --notes "The Android app built from a test branch. Not a release: for testing only." --target "${GITHUB_SHA}"
          fi
          gh release edit test-android --notes "The Android app from the $branch branch at ${GITHUB_SHA::7} ($APK). For testing only; not a release."
          gh release upload test-android mandarin-android-test.apk "android/$APK" --clobber

      # One APK in dist/, committed once per versionName (and once more when a
      # signed build replaces a debug one), so the README and the Pages site can
      # link straight at it. From main only. Pushed with GITHUB_TOKEN, which
      # does not trigger workflows, so this cannot loop.
      #
      # Without the signing secrets the published APK (a release build) is
      # signed with the committed key: the same every build, so updates
      # install in place.
      - name: Publish the APK into dist/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          APK: ${{ steps.name.outputs.apk }}
        run: |
          set -euo pipefail
          # One fixed name, so the README and the site link straight at the file.
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          OUT=mandarin-android.apk
          if [ -f "dist/$OUT" ] && grep -q "\"version\": \"$version\"" dist/latest.json && grep -q "\"file\": \"$APK\"" dist/latest.json; then
            echo "$version already published"; exit 0
          fi
          git rm -q --ignore-unmatch 'dist/musicd-server-android-*.apk' "dist/$OUT"
          mkdir -p dist
          cp "android/$APK" "dist/$OUT"
          sha=$(sha256sum "dist/$OUT" | cut -d' ' -f1)
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/raw/main/dist/%s",\n  "sha256": "%s",\n  "file": "%s"\n}\n' \
            "$version" "$GITHUB_REPOSITORY" "$OUT" "$sha" "$APK" > dist/latest.json
          git add "dist/$OUT" dist/latest.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish $OUT ($APK)" -m "Built from ${GITHUB_SHA}."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
