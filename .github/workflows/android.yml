name: Android

# The APK is built here: GitHub's runners carry the Android SDK, so this is the
# shortest path from a commit to something installable. Every push produces
# an artifact, and pushes to main publish the APK into dist/ when versionName
# changes, once CI has passed on the same commit (v0.8.32): the app goes out
# with the server's release, never ahead of its tests.
#
# dev is built by android-dev.yml on every push, whatever changed, so every dev
# image of the server has a test APK of the same number (item 170: a dev push
# of server code alone built no APK, and the test build fell behind). Other
# branches and main build here when the app, the page or this file changes.
on:
  push:
    branches: ["**", "!dev"]
    paths: ["android/**", "public/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "public/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write   # the APK reaches main through a pull request (v1.0.0)
  actions: read     # to see CI's runs (.github/wait-for-ci.sh)

# One run at a time for each branch (item 175), so an older run finishing late
# never puts its test APK over a newer one's: a newer push to dev, a branch or a
# pull request cancels the run before it. main's is never cut short, mid-way
# through its publication into dist/: a newer one waits for it. Named here, not
# after github.workflow, which a run called from another workflow takes from it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          distribution: temurin
          java-version: '17'
      # setup-gradle's own caching, open source (MIT) on actions/cache: from v6 its
      # default is a proprietary cache library, which this repository doesn't need.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
        with:
          cache-provider: basic
          # dev keeps Gradle's cache as main does (item 350): its builds take the wrapper and the libraries from it,
          # not from downloads that can fail (by default only the default branch writes it).
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
      - name: Run the core test suite
        run: ../.github/gradle-retry.sh :core:test --no-daemon --stacktrace   # a failed download tried again (item 350)
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test

  # The Tailscale engine the app runs (android/musicdnet): its tests drive it
  # the way the app does, over a private tailnet made on the runner.
  engine:
    name: Tailscale engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/musicdnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: android/musicdnet/go.mod
          cache-dependency-path: android/musicdnet/go.sum
      - run: go vet ./...
      - run: go test -count=1 -v ./...

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: [core, engine]
    # The build, then the wait for CI before publishing to dist/ or the test build (an hour at most).
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The history and the tags, for a test build's number (below).
          fetch-depth: 0
          # Commits and trees, not every file's every version: the history carries each APK published,
          # gigabytes, which ran past the gates' 10 minutes (item 222). A file of an older commit is
          # fetched when it is read.
          filter: blob:none
      # dev's APK is a test build (bug list item 141): the next release with -tN (tools/test-version.js), as the
      # server's image is, its versionName stamped for the build only; versionCode stays the release's, so the next
      # release installs over it. Never on main: that is the release's own.
      - name: Stamp a test build's version
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: .
        run: |
          set -e
          v=$(node tools/test-version.js)
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$v\"/" android/app/build.gradle.kts
          grep -n 'versionName' android/app/build.gradle.kts
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          distribution: temurin
          java-version: '17'
      # Not `tools`: the legacy SDK Tools package is obsolete and fails to
      # download often enough to take a build down with it.
      # The NDK and CMake build the app's native code (Media3's Opus decoder
      # over libopus, android/app/src/main/cpp); the versions match
      # android/app/build.gradle.kts.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: android/musicdnet/go.mod
          cache-dependency-path: android/musicdnet/go.sum
      # Plain Go, no NDK: Android on 64-bit ARM links without C tools.
      - name: Build the Tailscale engine
        working-directory: android/musicdnet
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' ../app/build.gradle.kts)
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=$version" \
            -o ../app/src/main/jniLibs/arm64-v8a/libmusicdnet.so .
          ls -la ../app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
        with:
          cache-provider: basic
          # dev keeps Gradle's cache as main does (item 350): its builds take the wrapper and the libraries from it,
          # not from downloads that can fail (by default only the default branch writes it).
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      # The signing key comes from repository secrets — the same two as
      # Android Random Remote (MUSICD_KEYSTORE_BASE64, MUSICD_KEYSTORE_PASSWORD).
      # Without them a build that may be published fails (item 364); only a pull
      # request's, never published, is signed with the key committed in android/app.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Never published signed with the committed debug key (item 364, the security audit's tenth finding): anyone
            # can sign with it, and a phone would take such an APK as an update. Only a pull request's build, which is
            # never published (a fork's or Dependabot's, given no secrets), may use it.
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::error::MUSICD_KEYSTORE_BASE64 is not set: a build that may be published is never signed with the committed debug key."
              exit 1
            fi
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MUSICD_KEYSTORE_BASE64 is not set: a pull request's build, signed with the committed debug key and never published."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musicd-release.jks"
          echo "path=$RUNNER_TEMP/musicd-release.jks" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      # libopus for the app's native code (item 351), fetched once and kept: its GitHub release with curl's own
      # retries, else Xiph's downloads, its SHA-256 checked here and again by CMake (app/src/main/cpp/CMakeLists.txt),
      # which builds from it rather than downloading it itself.
      - name: Keep libopus's source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ runner.temp }}/opus
          key: opus-1.5.2-65c1d2f7
      - name: Fetch libopus's source
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/opus"
          f="$RUNNER_TEMP/opus/opus-1.5.2.tar.gz"
          sum=65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
          if ! echo "$sum  $f" | sha256sum -c --quiet >/dev/null 2>&1; then
            rm -f "$f"
            for url in https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz; do
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$f" "$url" && echo "$sum  $f" | sha256sum -c --quiet && break
              echo "::warning::libopus from $url didn't come, or wasn't libopus 1.5.2's"; rm -f "$f"
            done
          fi
          if [ -f "$f" ]; then echo "OPUS_TARBALL=$f" >> "$GITHUB_ENV"; else echo "::warning::libopus couldn't be fetched ahead: CMake fetches it itself"; fi

      - name: Assemble
        env:
          MUSICD_KEYSTORE: ${{ steps.signing.outputs.path }}
          MUSICD_KEYSTORE_PASSWORD: ${{ secrets.MUSICD_KEYSTORE_PASSWORD }}
          MUSICD_KEY_ALIAS: musicd
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        # Always the release build (v0.6.10): optimised and not debuggable.
        # Without the secrets it's signed with the committed key, the same
        # as every build before it, so it installs over them in place.
        run: ../.github/gradle-retry.sh :app:assembleRelease --no-daemon --stacktrace   # a failed download tried again (item 350)

      - name: Name the APK after the version
        id: name
        env:
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Mandarin-Android-<version>.apk (v0.9.7; musicd-server-android-… before).
          # "-shared-key": signed with the committed key rather than a private release key.
          if [ "$HAVE_KEY" = "true" ]; then out="Mandarin-Android-${version}.apk"
          else out="Mandarin-Android-${version}-shared-key.apk"; fi
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/${{ steps.name.outputs.apk }}

      # CI on this commit, passed: every test (v0.8.32), as
      # the release and the image wait for it (.github/wait-for-ci.sh). Without
      # this the app reached phones some 15 minutes before the server it goes
      # with, and before that version's tests had finished. Before every APK
      # published, main's into dist/ and dev's test build alike (item 175: dev's
      # waited for nothing, so a commit whose tests failed still reached the
      # phone, where dev's image waited for CI).
      - name: Wait for CI to pass
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/claude/v0.8'))
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

      # A test branch's app (v0.8.0 on): a direct download for the phone, from
      # the rolling "test-android" pre-release, at one fixed address. Never
      # "latest", and the app's own update check reads main's dist/, so
      # nothing offers it to anyone who didn't fetch it. The dev branch's app
      # too (CLAUDE.md section 4; the migration branch's from v0.8.46, renamed),
      # the one the owner installs beside :dev: the same pre-release's file
      # replaced, no tag or release made. That one file only (item 128): a copy
      # under each version's name piled up, 46 of them; the notes say the version.
      - name: Publish a test branch's APK
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/claude/v0.8') || github.ref == 'refs/heads/dev')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
        run: |
          set -e
          cp "android/$APK" mandarin-android-test.apk
          branch="${GITHUB_REF#refs/heads/}"
          if ! gh release view test-android >/dev/null 2>&1; then
            gh release create test-android --prerelease --latest=false --title "Android app — test build" \
              --notes "The Android app built from a test branch. Not a release: for testing only." --target "${GITHUB_SHA}"
          fi
          gh release edit test-android --notes "The Android app from the $branch branch at ${GITHUB_SHA::7} ($APK). For testing only; not a release."
          gh release upload test-android mandarin-android-test.apk --clobber

      # One APK in dist/, committed once per versionName (and once more when a
      # signed build replaces a debug one), so the README and the Pages site can
      # link straight at it. From main only. main takes changes only through a
      # pull request (the "Protect main and migration" ruleset, migration now dev), so the two files
      # go to a branch of their own, publish-apk/<version>, and a pull request
      # into main that this job merges (no approval is required). That needs
      # Settings → Actions → General → "Allow GitHub Actions to create and
      # approve pull requests". Made with GITHUB_TOKEN, which does not trigger
      # workflows, so this cannot loop. (v1.0.0; a direct push to main before.)
      #
      # Without the signing secrets the published APK (a release build) is
      # signed with the committed key: the same every build, so updates
      # install in place.
      - name: Publish the APK into dist/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          APK: ${{ steps.name.outputs.apk }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # On main as it is now, not on the commit built: .github/publish-apk.sh.
        run: .github/publish-apk.sh "android/$APK"
