<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0f12">
  <title>Mandarin Wall Display</title>
  <link rel="icon" href="/icons/favicon.ico?v=brassduck" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=brassduck">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #0e0f12; color: #e9e4d8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 0 1.5rem; box-sizing: border-box; }
    main { max-width: 34rem; }
    h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 700; margin: 0 0 .8rem; }
    p { color: #a8a294; font-size: clamp(1rem, 2.4vw, 1.2rem); line-height: 1.5; margin: 0 0 1.4rem; }
    a { display: inline-block; color: #0e0f12; background: #c9a45c; text-decoration: none; font-weight: 700; border-radius: 999px; padding: .7rem 1.4rem; }
  </style>
</head>
<body>
  <main>
    <h1>The wall display is turned off</h1>
    <p>Turn it on in Mandarin: Settings → Setup → Wall Display, then reload this page.</p>
