# Mandarin Bridge on its Raspberry Pi image (bridge/pi, item 283): run as root, so its page can set the Wi-Fi through
# NetworkManager (--wifi), and a setup network opened where there is none (Wifi.cs). Its own user's data folder and
# the limits on what it may write (the Linux service's, item 415) aren't for it: as it always ran on the Pi.
[Service]
DynamicUser=no
User=root
Group=root
ExecStartPre=
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
NoNewPrivileges=no
RestrictSUIDSGID=no
RemoveIPC=no
ExecStart=
ExecStart=/usr/lib/mandarin-bridge/mandarin-bridge --data /var/lib/mandarin-bridge --engine /usr/lib/mandarin-bridge/mandarin-audio --wifi
