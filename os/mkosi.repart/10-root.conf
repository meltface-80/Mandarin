# The system (A), labelled with its version (mandarin-os_0.1.4: %A, the IMAGE_VERSION mkosi writes into os-release),
# on the stick only as big as what is in it (a smaller download). Installed, it is copied into a 4 GB partition and
# grown to fill it by the installer (install.repart.d), a second (B) kept empty beside it for the next version.
[Partition]
Type=root
Label=mandarin-os_%A
Format=ext4
CopyFiles=/
Minimize=guess
