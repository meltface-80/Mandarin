# The system the stick booted, copied block for block, labelled with its version (mandarin-os_0.1.4: %A, the image's
# IMAGE_VERSION) as every system partition is (boot.sh); the installer grows its file system to fill the 4 GB.
[Partition]
Type=root
Label=mandarin-os_%A
CopyBlocks=auto
SizeMinBytes=4G
SizeMaxBytes=4G
