# Mandarin OS's share: smb://mandarin/data (\\mandarin\Data), for the user and password chosen at install, no guest.
# Laid out as mandarin-os-apply makes it: Storage to copy music into; Logs, Mandarin's one log (item 425), MandarinServer
# with its backups, MandarinOS and MachineSettings, read-only by their permissions. Samba's own lines go to the journal,
# and from there into the one log.
[global]
   server string = Mandarin
   netbios name = MANDARIN
   workgroup = WORKGROUP
   server role = standalone server
   server min protocol = SMB2_10
   map to guest = never
   restrict anonymous = 2
   unix extensions = no
   follow symlinks = yes
   wide links = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = systemd

[Data]
   path = /data/Share
   valid users = @mandarin-share
   read only = no
   browseable = yes
   force group = mandarin
   create mask = 0664
   directory mask = 2775
   veto files = /lost+found/
