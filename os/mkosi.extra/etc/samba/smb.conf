# Mandarin OS's share: smb://mandarin/data (\\mandarin\Data), for the user and password chosen at install, no guest.
# Laid out as ROCK's Data share is (mandarin-os-apply makes it): Storage to copy music into; MandarinServer,
# MandarinBridge, MandarinApp and MandarinOS with their logs, MachineSettings, read-only by their permissions.
[global]
   server string = Mandarin
   netbios name = MANDARIN
   workgroup = WORKGROUP
   server role = standalone server
   server min protocol = SMB2_10
   map to guest = never
   restrict anonymous = 2
   unix extensions = no
   follow symlinks = yes
   wide links = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /data/MandarinOS/Logs/samba.log
   max log size = 1000
   logging = file

[Data]
   path = /data/Share
   valid users = @mandarin-share
   read only = no
   browseable = yes
   force group = mandarin
   create mask = 0664
   directory mask = 2775
   veto files = /lost+found/
