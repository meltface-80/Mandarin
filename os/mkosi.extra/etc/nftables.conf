#!/usr/sbin/nft -f
# Mandarin OS's firewall: nothing comes in but what Mandarin and the OS answer (item 389: no SSH, closed). Every port
# here is one something on the box listens on; the QEMU test (os/test/boot-test.sh) checks each still works through it.
flush ruleset

table inet mandarin {
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    # DHCP and DHCPv6 answers.
    udp dport { 68, 546 } accept
    # The system page (80), Mandarin (3500), the share (SMB 445), Windows' discovery of it (WS-Discovery 5357),
    # Mandarin Bridges and Squeezelite players (SlimProto 3483).
    tcp dport { 80, 445, 3483, 3500, 5357 } accept
    # Speakers and renderers announcing themselves (SSDP 1900), SlimProto discovery (3483), WS-Discovery (3702),
    # mDNS (mandarin.local, 5353), and the built-in Tailscale's direct connections (41641).
    udp dport { 1900, 3483, 3702, 5353, 41641 } accept
    # Speakers answering Mandarin's own search for them (M-SEARCH), from their port 1900 to whichever port it asked from.
    udp sport 1900 accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
