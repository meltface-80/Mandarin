# Mandarin Bridge on Mandarin OS (item 415): its own user, mandarin-bridge (3503 in every version, mkosi.postinst.chroot
# and apply), never a DynamicUser. systemd 257 mounts a DynamicUser's data folder so nothing in it can be run, and the
# Bridge's update runs from there: a Bridge installed before 0.3.12 (its service a DynamicUser's, carried from version
# to version) couldn't update. As the service install.sh installs from 0.3.12, which this leaves as it is.
[Unit]
After=mandarin-os-apply.service

[Service]
DynamicUser=no
User=mandarin-bridge
Group=mandarin-bridge
# Its data folder made the Bridge's by apply first (mandarin-os-apply.service, above): a DynamicUser's is nobody's
# (systemd 257's way), which systemd would still mount ID-mapped and noexec. systemd then moves it back from
# /var/lib/private as it starts: who it is to Mandarin, its settings and its logs kept.
Environment=HOME=/var/lib/mandarin-bridge
# What a DynamicUser had.
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
NoNewPrivileges=yes
RestrictSUIDSGID=yes
RemoveIPC=yes
