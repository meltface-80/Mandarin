[Unit]
# Its data is on the data partition (Mandarin OS); on the USB stick, where there is none, it doesn't start.
RequiresMountsFor=/data
After=mandarin-os-apply.service
ConditionPathIsMountPoint=/data

[Service]
# Mandarin knows it is Mandarin OS: what it says to do (a forgotten password, an empty library) is for this box.
EnvironmentFile=/usr/lib/mandarin-os/environment
# The builds its own updates follow, as Reinstall Mandarin last installed it (channel.sh, item 405): kept on the data
# partition, so an update of Mandarin OS leaves it as it is. None: the releases.
EnvironmentFile=-/data/MachineSettings/mandarin-channel.env
