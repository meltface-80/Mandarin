# Mandarin OS (item 389's plan, phase 3): Debian 13, built with mkosi (os/README.md). x86-64, UEFI.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Mirror=https://deb.debian.org/debian

[Output]
Format=disk
ImageId=mandarin-os
CompressOutput=no
SplitArtifacts=no

[Build]
# The postinst fetches Mandarin's latest release (tools/linux/install.sh), checked against the release key.
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
# The screen quiet: systemd's start-up lines go to the last console, the serial port (where a test's virtual machine reads
# and checks them), never to the screen, which shows the installer or where to find Mandarin and nothing else.
# A start that can't go on starts again, never waits for a hand at the box (item 401: a new version that doesn't start
# is tried three times, then the one before starts): the kernel's panic after 30 seconds, systemd's crash, and the
# emergency mode, in the initrd (no system partition found or mounted) and after it. The last is a drop-in for
# emergency.service given as a credential (systemd-debug-generator writes it, in the initrd too), base64 of:
#   [Unit] SuccessAction=reboot-force FailureAction=reboot-force [Service] ExecStart= ExecStart=/usr/bin/sleep 10
# There is no shell for it to offer anyway: the root account is locked, and Mandarin OS has no login.
# Installed, each version's entry on the EFI partition passes this on with root= its own partition (boot.sh).
KernelCommandLine=quiet loglevel=3 console=tty1 console=ttyS0 panic=30 systemd.crash_action=reboot
                  systemd.set_credential_binary=systemd.unit-dropin.emergency.service:W1VuaXRdClN1Y2Nlc3NBY3Rpb249cmVib290LWZvcmNlCkZhaWx1cmVBY3Rpb249cmVib290LWZvcmNlCltTZXJ2aWNlXQpFeGVjU3RhcnQ9CkV4ZWNTdGFydD0vdXNyL2Jpbi9zbGVlcCAxMAo=
Hostname=mandarin
Locale=C.UTF-8
Timezone=Etc/UTC
WithDocs=no
# What starts the system and finds its disks, in the kernel image (a 160 MB image with every driver and firmware in it
# before): NVMe, SATA, SCSI, USB sticks and drives, SD and eMMC, Intel VMD, virtual disks, ext4 and FAT, and the
# kernel's checksums and libraries they ask for by name alone (crc32c for ext4), with mkosi's own list of what a start
# needs (default: efivarfs, to find the disk it started from, autofs4…; left out, it didn't start). Every other
# driver and its firmware (network cards, sound, DACs) is on the system, loaded once it has started.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default,crypto/,lib/,drivers/nvme/,drivers/ata/,drivers/scsi/,drivers/usb/storage/,drivers/usb/host/,drivers/block/,drivers/virtio/,drivers/mmc/,drivers/pci/controller/vmd,fs/ext4/,fs/fat/,fs/nls/,fs/jbd2/,fs/mbcache
# ffmpeg isn't Debian's (about 300 MB of video, GPU and speech libraries Mandarin never uses): it is built from Debian's
# own source by mkosi.build.chroot (os/ffmpeg), with only the libraries listed here beside it.
BuildPackages=
        gcc
        make
        nasm
        pkg-config
        patch
        xz-utils
        libc6-dev
        libsoxr-dev
        libopus-dev
        libmp3lame-dev
        libgnutls28-dev
        libfreetype-dev
        libharfbuzz-dev
        libfontconfig-dev
        zlib1g-dev
        libbz2-dev
# Never: openssh-server, sudo, a desktop. The way in is the box's own screen (mandarin-console) and the system page.
Packages=
        linux-image-amd64
        intel-microcode
        amd64-microcode
        firmware-linux-free
        firmware-misc-nonfree
        firmware-realtek
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        udev
        dbus
        kbd
        network-manager
        nftables
        avahi-daemon
        wsdd2
        samba
        apt
        unattended-upgrades
        libsoxr0
        libopus0
        libmp3lame0
        libgnutls30t64
        libfreetype6
        libharfbuzz0b
        libfontconfig1
        fonts-dejavu-core
        libbz2-1.0
        zlib1g
        poppler-utils
        python3
        python3-numpy
        libicu76
        libasound2t64
        curl
        ca-certificates
        openssl
        jq
        dialog
        iproute2
        iputils-ping
        procps
        util-linux
        fdisk
        e2fsprogs
        dosfstools
        exfatprogs
        ntfs-3g
