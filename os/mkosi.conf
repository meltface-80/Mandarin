# Mandarin OS (item 389's plan, phase 3): Debian 13, built with mkosi (os/README.md). x86-64, UEFI.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Mirror=https://deb.debian.org/debian

[Output]
Format=disk
ImageId=mandarin-os
CompressOutput=no
SplitArtifacts=no

[Build]
# The postinst fetches Mandarin's latest release (tools/linux/install.sh), checked against the release key.
WithNetwork=yes
# The packages and the base kept between builds (mkosi.cache), so a change to a script builds in a minute or two.
Incremental=yes
CacheDirectory=mkosi.cache

[Content]
Bootable=yes
Bootloader=systemd-boot
# The screen first; the serial port too, where a test's virtual machine reads it.
KernelCommandLine=quiet loglevel=3 console=ttyS0 console=tty1
Hostname=mandarin
Locale=C.UTF-8
Timezone=Etc/UTC
WithDocs=no
# ffmpeg isn't Debian's (about 300 MB of video, GPU and speech libraries Mandarin never uses): it is built from Debian's
# own source by mkosi.build.chroot (os/ffmpeg), with only the libraries listed here beside it.
BuildPackages=
        gcc
        make
        nasm
        pkg-config
        patch
        xz-utils
        libc6-dev
        libsoxr-dev
        libopus-dev
        libmp3lame-dev
        libgnutls28-dev
        libfreetype-dev
        libharfbuzz-dev
        libfontconfig-dev
        zlib1g-dev
        libbz2-dev
# Never: openssh-server, sudo, a desktop. The way in is the box's own screen (mandarin-console) and the system page.
Packages=
        linux-image-amd64
        intel-microcode
        amd64-microcode
        firmware-linux-free
        firmware-misc-nonfree
        firmware-realtek
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        udev
        dbus
        kbd
        network-manager
        nftables
        avahi-daemon
        wsdd2
        samba
        apt
        unattended-upgrades
        libsoxr0
        libopus0
        libmp3lame0
        libgnutls30t64
        libfreetype6
        libharfbuzz0b
        libfontconfig1
        fonts-dejavu-core
        libbz2-1.0
        zlib1g
        poppler-utils
        python3
        python3-numpy
        libicu76
        libasound2t64
        curl
        ca-certificates
        openssl
        jq
        dialog
        iproute2
        iputils-ping
        procps
        util-linux
        fdisk
        e2fsprogs
        dosfstools
        exfatprogs
        ntfs-3g
