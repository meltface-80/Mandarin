<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191c">
<title>SQ-tool</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16h4l3-9 5 18 4-14 3 5h7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>
      <span class="title">SQ-tool</span>
      <span class="tagline">Does your DAC get exactly the file?</span>
    </span>
  </a>
  <span class="top-actions">
    <span id="rec-badge" class="live" hidden>REC</span>
    <button class="iconbtn" id="btn-help" aria-label="How SQ-tool works" title="How SQ-tool works">?</button>
  </span>
</header>
<main id="main"></main>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><button class="sheet-close" data-close aria-label="Close">&times;</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<footer class="footer"><span id="version">SQ-tool</span> · <span id="free"></span> · <a href="/">Back to Mandarin</a></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
